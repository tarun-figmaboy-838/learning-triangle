<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Bridge Builder: Triangle Workshop</title>
  <link rel="icon" href="data:,">
  <!-- Built from styles/ and js/ by tools/build.py: one classic script, so the page also runs when opened from disk. -->
  <link rel="stylesheet" href="dist/app.css?v=1794832339">
  <script src="dist/app.js?v=1794832339" defer></script>
</head>
<body>
  <div id="viewport" class="viewport">
    <div id="stage" class="stage" aria-label="Triangle Workshop stage">

      <!-- World: everything the camera moves. -->
      <div id="world" class="world">
        <div id="shake" class="shake-layer">
          <div class="backdrop">
            <picture>
              <source srcset="assets/images/background/canal.avif" type="image/avif">
              <img src="assets/images/background/canal.webp" alt="" draggable="false" fetchpriority="high">
            </picture>
          </div>
          <div id="water" class="water-layer" aria-hidden="true"></div>
          <div id="bridge" class="bridge"></div>
          <div id="placed" class="placed-layer"></div>
          <div id="workshop" class="workshop-layer"></div>
          <div id="platform" class="platform"></div>
          <div id="crane" class="crane"></div>
          <div id="fx" class="fx-layer" aria-hidden="true"></div>
        </div>
      </div>

      <!-- HUD: fixed to the stage, never moved by the camera. -->
      <div id="hud" class="hud">
        <button id="mute" class="icon-button mute-button" type="button" aria-label="Mute sound" aria-pressed="false"></button>
      </div>

      <!-- Overlays: the title, the operator's speech bubble, the replay button. -->
      <div id="overlays" class="overlays"></div>

      <div id="loader" class="loader" role="status" aria-label="Loading the workshop">
        <img class="loader__logo" src="assets/images/ui/title-logo.webp" alt="" draggable="false" fetchpriority="high">
        <div class="loader__bar"><span class="loader__fill"><span class="loader__hook"></span></span></div>
        <p class="loader__text">Loading the workshop<span class="loader__dots"><i>.</i><i>.</i><i>.</i></span></p>
      </div>
    </div>
  </div>
  <noscript><p style="color:#fff;font:20px sans-serif;text-align:center">Please enable JavaScript to play.</p></noscript>
</body>
</html>
